[package]
name = "relayer"
version = "0.1.0"
edition = "2021"

[dependencies]
tezos-lc = { path = "../sp1/crates/tezos-lc" }
tezos-merkle = { path = "../sp1/crates/tezos-merkle" }
tezos-consensus = { path = "../sp1/crates/tezos-consensus" }
sp1-sdk = { version = "~6.8", features = ["network"] }
alloy = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
sp1-build = "~6.8"
